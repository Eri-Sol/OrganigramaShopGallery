<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="description" content="Organigrama interactivo ShopGallery - Agosto 2026" />
  <title>Organigrama ShopGallery · Agosto 2026</title>
  <style>
    :root{
      --bg:#eef1f4;--panel:#fff;--text:#203747;--muted:#6b7280;--line:#dce2e8;
      --orange:#f4b183;--blue:#9fc5e8;--green:#a9d6b5;--purple:#c8b5e6;
      --yellow:#f4d58d;--pink:#efb6c8;--shadow:0 8px 24px rgba(32,55,71,.09)
    }
    *{box-sizing:border-box}
    body{margin:0;font-family:Inter,Segoe UI,Arial,sans-serif;background:var(--bg);color:var(--text)}
    .topbar{position:sticky;top:0;z-index:20;background:rgba(238,241,244,.96);backdrop-filter:blur(8px);border-bottom:1px solid var(--line)}
    .wrap{max-width:1480px;margin:0 auto;padding:16px 20px}
    .brandrow{display:flex;justify-content:space-between;align-items:center;gap:16px;flex-wrap:wrap}
    .brand{display:flex;align-items:center}.brand img{display:block;width:230px;max-width:55vw;height:auto}
    .subtitle{font-size:13px;color:var(--muted);margin-top:2px}
    .controls{display:grid;grid-template-columns:minmax(280px,1.4fr) 220px auto auto auto;gap:10px;margin-top:14px;align-items:center}
    input,select,button{font:inherit}
    input,select{width:100%;border:1px solid var(--line);background:#fff;border-radius:10px;padding:10px 12px;color:var(--text)}
    button{border:1px solid var(--line);background:#fff;border-radius:10px;padding:10px 12px;cursor:pointer;color:var(--text)}
    button:hover{border-color:#9aa1aa;background:#fafafa}
    .meta{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}
    .chip{background:#fff;border:1px solid var(--line);border-radius:999px;padding:6px 10px;font-size:12px;color:#444}
    main{max-width:1480px;margin:0 auto;padding:18px 20px 40px}
    .hint{background:#fff7ed;border:1px solid #fed7aa;padding:10px 12px;border-radius:10px;color:#7c2d12;font-size:13px;margin-bottom:14px}
    .detail{display:none;background:#fff;border:1px solid var(--line);border-left:4px solid var(--orange);border-radius:12px;padding:14px 16px;margin-bottom:14px;box-shadow:var(--shadow)}
    .detail.show{display:block}.detail h3{margin:0 0 6px;font-size:16px}.path{font-size:13px;color:var(--muted);line-height:1.5}
    .areas{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:14px;align-items:start}
    details.area{background:rgba(255,255,255,.72);border:1px solid var(--line);border-top:4px solid var(--area);border-radius:16px;padding:10px;box-shadow:var(--shadow);min-width:0}
    details.area>summary{padding:4px 2px 10px;display:flex;justify-content:space-between;gap:8px;align-items:center}
    .areas .branch{margin-left:8px;padding-left:10px}.areas .branch>.nodewrap:before{left:-10px;width:8px}
    .areas .nodecard{border-left-width:3px;padding:9px 10px;border-radius:12px}
    .areas .avatar{display:none}
    .areas .name{font-size:13px}.areas .role{font-size:11px}
    details.area{background:transparent;border-top:3px solid var(--area);padding-top:6px}
    details.area>summary{list-style:none;cursor:pointer;display:flex;align-items:center;justify-content:space-between;gap:12px;padding:4px 2px 8px}
    details.area>summary::-webkit-details-marker{display:none}
    .area-title{font-weight:700}.area-count{font-size:12px;color:var(--muted)}
    .tree{padding:2px 0 4px}
    .branch{margin-left:20px;padding-left:18px;border-left:1px solid var(--line)}
    .nodewrap{position:relative;margin:8px 0}
    .branch>.nodewrap:before{content:"";position:absolute;left:-18px;top:26px;width:16px;border-top:1px solid var(--line)}
    details.node>summary{list-style:none;cursor:pointer}.node>summary::-webkit-details-marker{display:none}
    .nodecard{display:flex;align-items:flex-start;gap:10px;width:min(100%,760px);background:#fff;border:1px solid var(--line);border-left:4px solid var(--node);border-radius:10px;padding:10px 12px;box-shadow:0 1px 4px rgba(0,0,0,.03)}
    .nodecard:hover{border-color:#aab0b7;box-shadow:0 4px 10px rgba(0,0,0,.05)}
    .avatar{flex:0 0 30px;height:30px;border-radius:50%;background:#f1f3f5;display:grid;place-items:center;font-weight:700;font-size:11px;color:#555}
    .nodebody{min-width:0}.name{font-weight:700;font-size:14px}.role{font-size:12px;color:var(--muted);margin-top:2px}.toggle{margin-left:auto;color:#8a8f98;font-size:12px;padding-top:2px}
    .match>.nodecard{outline:2px solid var(--orange);outline-offset:2px}
    .hiddenByFilter{display:none!important}
    .exec{margin-bottom:16px}.exec .nodecard{border-left-color:#ef4444}.exec .branch{border-left-color:#efc4c4}
    .legend{display:flex;flex-wrap:wrap;gap:8px;margin:0 0 14px}.legend span{font-size:12px;background:#fff;border:1px solid var(--line);padding:5px 8px;border-radius:999px}
    footer{max-width:1480px;margin:0 auto;padding:0 20px 28px;color:var(--muted);font-size:12px}
    @media(max-width:1200px){.areas{grid-template-columns:repeat(2,minmax(0,1fr))}}
    @media(max-width:900px){.controls{grid-template-columns:1fr 1fr}.controls button{width:100%}}
    .searchbox{position:relative}.search-results{position:absolute;left:0;right:0;top:calc(100% + 6px);background:#fff;border:1px solid var(--line);border-radius:12px;box-shadow:var(--shadow);max-height:320px;overflow:auto;z-index:50;display:none}.search-results.show{display:block}.search-item{padding:10px 12px;border-bottom:1px solid var(--line);cursor:pointer}.search-item:last-child{border-bottom:0}.search-item:hover{background:#f4f7f9}.search-item strong{display:block}.search-item span{font-size:12px;color:var(--muted)}
    @media(max-width:620px){.wrap,main,footer{padding-left:12px;padding-right:12px}.controls{grid-template-columns:1fr}.areas{grid-template-columns:1fr}.brand{font-size:24px}.branch{margin-left:10px;padding-left:12px}.branch>.nodewrap:before{left:-12px;width:10px}.nodecard{width:100%}}
    @media print{.topbar,.hint,.legend,footer{display:none!important}body{background:#fff}main{max-width:none;padding:0}.areas{gap:8px}.nodecard{box-shadow:none;break-inside:avoid}details{display:block!important}details>*{display:block!important}}


    /* Vista horizontal por área: respeta la escala jerárquica de izquierda a derecha */
    .area-horizontal{min-width:1180px;padding:24px 18px 40px;text-align:left}
    .h-tree{display:flex;align-items:center;justify-content:flex-start;width:max-content;min-width:100%;padding:10px 20px}
    .h-node{display:flex;align-items:center;position:relative}
    .h-person{width:205px;flex:0 0 205px;position:relative;z-index:2}
    .h-person .nodecard{width:205px;min-height:74px;border-left:0;border-top:5px solid var(--node);text-align:center;display:block;padding:10px}
    .h-person .avatar{margin:0 auto 5px}
    .h-children{display:flex;flex-direction:column;gap:14px;margin-left:54px;position:relative;padding:8px 0}
    .h-children:before{content:"";position:absolute;left:-28px;top:37px;bottom:37px;border-left:2px solid var(--line)}
    .h-child{position:relative}
    .h-child:before{content:"";position:absolute;left:-28px;top:50%;width:28px;border-top:2px solid var(--line)}
    .h-node>.h-children:after{content:"";position:absolute;left:-54px;top:50%;width:26px;border-top:2px solid var(--line)}
    .area-heading{display:flex;align-items:center;justify-content:space-between;gap:12px;margin:0 20px 12px;padding-bottom:10px;border-bottom:1px solid var(--line)}
    .area-heading h2{margin:0;font-size:18px}.area-heading span{font-size:12px;color:var(--muted)}

    /* Organigrama clásico */
    main{max-width:none;padding:18px 20px 40px;overflow-x:auto}
    .legend{justify-content:center}
    .classic-org{min-width:1380px;padding:8px 20px 30px;text-align:center}
    .classic-level{display:flex;justify-content:center;position:relative}
    .classic-root{display:flex;flex-direction:column;align-items:center}
    .classic-root>.nodecard{width:230px}
    .classic-vline{width:2px;height:30px;background:var(--line)}
    .classic-managers{display:flex;justify-content:center;align-items:flex-start;gap:12px;position:relative;padding-top:30px}
    .classic-managers:before{content:"";position:absolute;top:0;left:6%;right:6%;height:2px;background:var(--line)}
    .classic-column{width:160px;position:relative;display:flex;flex-direction:column;align-items:stretch}
    .classic-column:before{content:"";position:absolute;top:-30px;left:50%;height:30px;width:2px;background:var(--line)}
    .classic-column>.nodecard{width:100%;min-height:92px;display:block;text-align:center;border-left:1px solid var(--line);border-top:5px solid var(--node);padding:10px 7px}
    .classic-column>.nodecard .avatar{margin:0 auto 5px}.classic-column>.nodecard .toggle{display:none}
    .team-btn{margin-top:10px;border-color:var(--node);font-size:12px;padding:7px 8px;background:#fff}
    .classic-team{margin-top:10px;text-align:left;display:none}
    .classic-team.open{display:block}
    .classic-team .branch{margin-left:8px;padding-left:10px}
    .classic-team .nodecard{width:100%;padding:8px;border-left:3px solid var(--node);box-shadow:none}
    .classic-team .avatar{display:none}.classic-team .name{font-size:12px}.classic-team .role{font-size:10px}
    .classic-team .branch>.nodewrap:before{left:-10px;width:8px;top:22px}
    .detail{position:sticky;left:20px;max-width:720px;z-index:5}
    .match>.nodecard,.nodecard.match{outline:3px solid #f4b183;outline-offset:3px}
    @media(max-width:900px){.classic-org{min-width:1120px}.classic-column{width:130px}.classic-managers{gap:8px}.classic-column>.nodecard{min-height:100px}.classic-column .name{font-size:12px}.classic-column .role{font-size:10px}}
  </style>
</head>

const search=document.getElementById('search');
const areaFilter=document.getElementById('areaFilter');
const exec=document.getElementById('exec');
const areas=document.getElementById('areas');
const detail=document.getElementById('detail');
const legend=document.getElementById('legend');
const searchResults=document.getElementById('searchResults');
const classicOrg=document.getElementById('classicOrg');
const clearFilters=document.getElementById('clearFilters');

Object.entries(labels).forEach(([k,v])=>{const o=document.createElement('option');o.value=k;o.textContent=v;areaFilter.appendChild(o);const l=document.createElement('span');l.innerHTML=`<b style="color:${colors[k]}">●</b> ${v}`;legend.appendChild(l)});

function norm(s){return (s||'').toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'')}
function initials(name){return name.split(/\s+/).slice(0,2).map(x=>x[0]).join('').toUpperCase()}
function findPath(target,node=data,path=[]){const p=[...path,node];if(node===target)return p;for(const c of node.children||[]){const r=findPath(target,c,p);if(r)return r}return null}
function showDetail(n){const p=findPath(n)||[];detail.classList.add('show');detail.innerHTML=`<h3>${n.name}</h3><div class="path"><strong>Puesto:</strong> ${n.role}</div><div class="path"><strong>Línea de reporte:</strong> ${p.map(x=>x.name).join(' → ')}</div>`;detail.scrollIntoView({behavior:'smooth',block:'nearest'})}
function makeNode(n){
  const wrap=document.createElement('div');wrap.className='nodewrap';wrap.dataset.area=n.area;wrap.dataset.search=norm(n.name+' '+n.role);
  const has=n.children&&n.children.length;let holder=wrap;
  if(has){const d=document.createElement('details');d.className='node';d.open=true;const s=document.createElement('summary');d.appendChild(s);wrap.appendChild(d);holder=s}
  const card=document.createElement('div');card.className='nodecard';card.style.setProperty('--node',colors[n.area]||'#999');
  card.innerHTML=`<div class="avatar">${initials(n.name)}</div><div class="nodebody"><div class="name">${n.name}</div><div class="role">${n.role}</div></div>${has?'<div class="toggle">▼</div>':''}`;
  card.addEventListener('click',e=>{e.preventDefault();e.stopPropagation();showDetail(n)});holder.appendChild(card);
  if(has){const d=wrap.querySelector('details');const b=document.createElement('div');b.className='branch';n.children.forEach(c=>b.appendChild(makeNode(c)));d.appendChild(b)}
  return wrap;
}
function render(){
  classicOrg.innerHTML='';
  const general=data.children[0];
  const selected=areaFilter.value;
  if(selected!=='all'){
    const manager=general.children.find(n=>n.area===selected);
    if(manager){
      classicOrg.className='area-horizontal';
      const head=document.createElement('div');head.className='area-heading';
      head.innerHTML=`<h2>${labels[selected]}</h2><span>Vista horizontal · la jerarquía avanza de izquierda a derecha</span>`;
      classicOrg.appendChild(head);
      const tree=document.createElement('div');tree.className='h-tree';tree.appendChild(makeHorizontalNode(manager));classicOrg.appendChild(tree);
      applySearch();return;
    }
  }
  classicOrg.className='classic-org';
  const root=document.createElement('div');root.className='classic-root';
  const director=makeSimpleCard(data);root.appendChild(director);
  const v1=document.createElement('div');v1.className='classic-vline';root.appendChild(v1);
  const gg=makeSimpleCard(general);root.appendChild(gg);
  const v2=document.createElement('div');v2.className='classic-vline';root.appendChild(v2);
  classicOrg.appendChild(root);
  const row=document.createElement('div');row.className='classic-managers';
  general.children.forEach(n=>{
    if(selected!=='all'&&n.area!==selected)return;
    const col=document.createElement('div');col.className='classic-column';col.dataset.area=n.area;
    col.appendChild(makeSimpleCard(n));
    if(n.children&&n.children.length){
      const btn=document.createElement('button');btn.type='button';btn.className='team-btn';btn.style.setProperty('--node',colors[n.area]);btn.textContent=`+ Ver equipo (${countNodes(n)-1})`;
      const team=document.createElement('div');team.className='classic-team';n.children.forEach(c=>team.appendChild(makeNode(c)));
      btn.addEventListener('click',()=>{const open=team.classList.toggle('open');btn.textContent=open?`− Ocultar equipo`:`+ Ver equipo (${countNodes(n)-1})`});
      col.appendChild(btn);col.appendChild(team);
    }
    row.appendChild(col);
  });
  classicOrg.appendChild(row);applySearch();
}

function makeHorizontalNode(n){
  const row=document.createElement('div');row.className='h-node';
  const person=document.createElement('div');person.className='h-person';
  person.appendChild(makeSimpleCard(n));row.appendChild(person);
  if(n.children&&n.children.length){
    const children=document.createElement('div');children.className='h-children';
    n.children.forEach(c=>{const child=document.createElement('div');child.className='h-child';child.appendChild(makeHorizontalNode(c));children.appendChild(child)});
    row.appendChild(children);
  }
  return row;
}

function makeSimpleCard(n){
  const card=document.createElement('div');card.className='nodecard';card.dataset.search=norm(n.name+' '+n.role);card.dataset.person=n.name;card.style.setProperty('--node',colors[n.area]||colors.direccion);
  card.innerHTML=`<div class="avatar">${initials(n.name)}</div><div class="nodebody"><div class="name">${n.name}</div><div class="role">${n.role}</div></div>`;
  card.addEventListener('click',()=>showDetail(n));return card;
}
function countNodes(n){return 1+(n.children||[]).reduce((a,c)=>a+countNodes(c),0)}
function flatten(n,out=[]){out.push(n);for(const c of n.children||[])flatten(c,out);return out}
const allPeople=flatten(data,[]);
function applySearch(){
  const q=norm(search.value.trim());
  document.querySelectorAll('.nodewrap,.nodecard').forEach(w=>w.classList.remove('match'));
  searchResults.innerHTML='';
  if(!q){searchResults.classList.remove('show');return;}
  const matches=allPeople.filter(n=>norm(n.name+' '+n.role).includes(q)).slice(0,12);
  if(!matches.length){searchResults.innerHTML='<div class="search-item"><strong>Sin resultados</strong><span>Probá con otro nombre o puesto.</span></div>';searchResults.classList.add('show');return;}
  matches.forEach(n=>{
    const item=document.createElement('div');item.className='search-item';item.innerHTML=`<strong>${n.name}</strong><span>${n.role} · ${labels[n.area]||'Dirección'}</span>`;
    item.addEventListener('click',()=>{
      areaFilter.value='all';render();
      const path=findPath(n)||[];const manager=path.length>2?path[2]:n;
      const col=[...document.querySelectorAll('.classic-column')].find(c=>c.dataset.area===manager.area && c.querySelector('.nodecard')?.dataset.person===manager.name);
      if(col){const team=col.querySelector('.classic-team');const btn=col.querySelector('.team-btn');if(team){team.classList.add('open');if(btn)btn.textContent='− Ocultar equipo';}}
      const targets=[...document.querySelectorAll('[data-search]')].filter(w=>w.dataset.search===norm(n.name+' '+n.role));
      const target=targets[targets.length-1];
      if(target){target.classList.add('match');let p=target.parentElement;while(p){if(p.classList&&p.classList.contains('classic-team'))p.classList.add('open');if(p.tagName==='DETAILS')p.open=true;p=p.parentElement}target.scrollIntoView({behavior:'smooth',block:'center',inline:'center'});}
      showDetail(n);searchResults.classList.remove('show');
    });searchResults.appendChild(item);
  });
  searchResults.classList.add('show');
}
document.addEventListener('click',e=>{if(!e.target.closest('.searchbox'))searchResults.classList.remove('show')});
search.addEventListener('input',applySearch);areaFilter.addEventListener('change',render);
document.getElementById('expand').addEventListener('click',()=>{document.querySelectorAll('.classic-team').forEach(t=>t.classList.add('open'));document.querySelectorAll('.team-btn').forEach(b=>b.textContent='− Ocultar equipo');document.querySelectorAll('details').forEach(d=>d.open=true)});
document.getElementById('collapse').addEventListener('click',()=>{document.querySelectorAll('.classic-team').forEach(t=>t.classList.remove('open'));render()});
clearFilters.addEventListener('click',()=>{search.value='';areaFilter.value='all';searchResults.innerHTML='';searchResults.classList.remove('show');detail.classList.remove('show');render();search.focus();});
render();
</script>
